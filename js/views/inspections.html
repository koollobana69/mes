<div class="mes-view">
  <div class="mes-ph"><div><div class="mes-eyebrow">Quality</div><h1 class="oj-typography-heading-lg">Inspection Log</h1>
    <div class="mes-sub">Every reading, checklist answer and serial scan, including superseded readings kept for audit.</div></div></div>
  <section class="mes-card">
    <div class="mes-card-bd mes-stack" style="gap:12px">
      <oj-tab-bar data="[[tabsDP]]" selection="{{tab}}" edge="top" aria-label="Log type"><template slot="itemTemplate" data-oj-as="it"><li :id="[[it.data.id]]"><a href="#"><oj-bind-text value="[[it.data.label]]"></oj-bind-text></a></li></template></oj-tab-bar>
      <div class="mes-row" style="align-items:flex-end">
        <oj-bind-if test="[[isResults]]"><oj-select-single label-hint="Item" data="[[itemDP]]" value="{{itemSel}}" style="max-width:200px"></oj-select-single></oj-bind-if>
        <oj-select-single label-hint="Result" data="[[resDP]]" value="{{resSel}}" style="max-width:200px"></oj-select-single>
        <oj-input-text label-hint="Search" value="{{q}}" placeholder="Serial, characteristic, value" clear-icon="conditional" style="max-width:300px"></oj-input-text>
        <span class="mes-count"><oj-bind-text value="[[t().note]]"></oj-bind-text></span>
      </div>
    </div>
    <div class="mes-card-bd flush"><oj-table class="mes-table tall" aria-label="Inspection log" data="[[t().dp]]" columns="[[t().columns]]"><template slot="rowTemplate" data-oj-as="row"><tr data-bind="foreach: row.data.cells"><td data-bind="html: $data"></td></tr></template><template slot="noData"><div class="mes-empty">Nothing matches.</div></template></oj-table></div>
  </section>
</div>
