<div class="mes-view">
  <div class="mes-ph"><div><div class="mes-eyebrow">Administration</div><h1 class="oj-typography-heading-lg">E-Signatures &amp; Audit Trail</h1>
    <div class="mes-sub">Every signature records signer, role, meaning, timestamp and a manifest hash bound to the record. The activity log is append-only.</div></div></div>
  <section class="mes-card">
    <div class="mes-card-bd mes-stack" style="gap:12px">
      <oj-tab-bar data="[[tabsDP]]" selection="{{tab}}" edge="top" aria-label="Audit view"><template slot="itemTemplate" data-oj-as="it"><li :id="[[it.data.id]]"><a href="#"><oj-bind-text value="[[it.data.label]]"></oj-bind-text></a></li></template></oj-tab-bar>
      <div class="mes-row" style="align-items:flex-end">
        <oj-select-single label-hint="User" data="[[userDP]]" value="{{user}}" style="max-width:240px"></oj-select-single>
        <oj-input-text label-hint="Search" value="{{q}}" clear-icon="conditional" style="max-width:300px"></oj-input-text>
        <span class="oj-typography-body-sm oj-text-color-secondary"><oj-bind-text value="[[t().note]]"></oj-bind-text></span>
      </div>
    </div>
    <div class="mes-card-bd flush"><oj-table class="mes-table tall" aria-label="Audit" data="[[t().dp]]" columns="[[t().columns]]"><template slot="rowTemplate" data-oj-as="row"><tr data-bind="foreach: row.data.cells"><td data-bind="html: $data"></td></tr></template></oj-table></div>
  </section>
</div>
