<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ridgeline MES</title>
<meta name="description" content="Interactive MES + QMS prototype for a vehicle plant: production jobs, station terminals, quality plans, discrepancies, holds, test records and as-built genealogy.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Ridgeline MES — plant-floor UI. Tokens first; components only reference tokens. */
:root {
  color-scheme: light;
  --bg: #eceff2;
  --surface: #ffffff;
  --surface-2: #f5f7f9;
  --surface-3: #e6eaee;
  --ink: #131a22;
  --ink-2: #46525f;
  --ink-3: #75818e;
  --line: #d6dce3;
  --line-2: #e5e9ee;
  --accent: #0b6784;
  --accent-ink: #ffffff;
  --accent-soft: #dcedf3;
  --side: #17202a;
  --side-2: #202b37;
  --side-ink: #b9c5d1;
  --side-ink-2: #7f8d9b;
  --ok: #1b7a44;       --ok-soft: #e1f2e8;
  --warn: #9a6200;     --warn-soft: #faefd6;
  --serious: #b4501b;  --serious-soft: #fbe8dc;
  --bad: #b8322a;      --bad-soft: #f9e1de;
  --info: #2a6fc4;     --info-soft: #e2ecf9;
  --muted-soft: #eceff2;
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a;
  --shadow: 0 1px 2px rgba(19, 26, 34, .06), 0 2px 8px rgba(19, 26, 34, .05);
  --radius: 8px;
  --font: 'Barlow', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-head: 'Barlow Semi Condensed', 'Barlow', 'Arial Narrow', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e1319; --surface: #161d25; --surface-2: #1b242e; --surface-3: #232e3a;
    --ink: #e7ecf1; --ink-2: #a9b5c1; --ink-3: #7c8997; --line: #2a3643; --line-2: #222c37;
    --accent: #3fa7c8; --accent-ink: #06141a; --accent-soft: #143441;
    --side: #0a0f14; --side-2: #141c25; --side-ink: #b3bfcb; --side-ink-2: #6f7d8b;
    --ok: #45b877; --ok-soft: #133022; --warn: #e2a93b; --warn-soft: #34290f;
    --serious: #ec8a52; --serious-soft: #3a2316; --bad: #f06b61; --bad-soft: #3b1a18;
    --info: #6aa5ec; --info-soft: #172a42; --muted-soft: #1f2832;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 2px 10px rgba(0, 0, 0, .25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1319; --surface: #161d25; --surface-2: #1b242e; --surface-3: #232e3a;
  --ink: #e7ecf1; --ink-2: #a9b5c1; --ink-3: #7c8997; --line: #2a3643; --line-2: #222c37;
  --accent: #3fa7c8; --accent-ink: #06141a; --accent-soft: #143441;
  --side: #0a0f14; --side-2: #141c25; --side-ink: #b3bfcb; --side-ink-2: #6f7d8b;
  --ok: #45b877; --ok-soft: #133022; --warn: #e2a93b; --warn-soft: #34290f;
  --serious: #ec8a52; --serious-soft: #3a2316; --bad: #f06b61; --bad-soft: #3b1a18;
  --info: #6aa5ec; --info-soft: #172a42; --muted-soft: #1f2832;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 2px 10px rgba(0, 0, 0, .25);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--font-head); margin: 0; text-wrap: balance; letter-spacing: .01em; }
.mono { font-family: var(--mono); font-size: .92em; letter-spacing: -.01em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.nowrap { white-space: nowrap; }
.right { text-align: right; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 232px 1fr; min-height: 100%; }
.side { background: var(--side); color: var(--side-ink); position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; }
.brand { padding: 18px 18px 14px; border-bottom: 1px solid var(--side-2); }
.brand .mark { display: flex; align-items: center; gap: 10px; }
.brand .logo { width: 30px; height: 30px; border-radius: 6px; background: linear-gradient(135deg, #0b6784, #0f8a9e); display: grid; place-items: center; color: #fff; font: 700 10.5px var(--font-head); letter-spacing: .02em; flex: none; }
.brand .t1 { font: 600 16px var(--font-head); color: #fff; letter-spacing: .02em; }
.brand .t2 { font-size: 12px; color: var(--side-ink-2); }
.nav { padding: 10px 10px 20px; display: flex; flex-direction: column; gap: 1px; }
.nav .grp { font: 600 11px var(--font); text-transform: uppercase; letter-spacing: .12em; color: var(--side-ink-2); padding: 14px 10px 6px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; color: var(--side-ink); font-size: 14px; }
.nav a:hover { background: var(--side-2); text-decoration: none; color: #fff; }
.nav a.on { background: var(--side-2); color: #fff; box-shadow: inset 3px 0 0 #3fa7c8; }
.nav a svg { width: 17px; height: 17px; flex: none; opacity: .85; }
.nav .badge { margin-left: auto; background: #b8322a; color: #fff; font: 600 11px var(--font); border-radius: 10px; padding: 1px 7px; }
.side .foot { margin-top: auto; padding: 14px 18px; font-size: 12px; color: var(--side-ink-2); border-top: 1px solid var(--side-2); }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 10px 24px; flex-wrap: wrap; }
.top form { flex: 1 1 260px; max-width: 420px; position: relative; }
.top input[type=search] { width: 100%; padding: 8px 12px 8px 34px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); }
.top form svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--ink-3); }
.top .spacer { flex: 1; }
.userbox { display: flex; align-items: center; gap: 10px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font: 600 12px var(--font); color: #fff; flex: none; }
.userbox select { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: var(--surface); max-width: 250px; }
.clock { font: 500 13px var(--mono); color: var(--ink-2); }
.page { padding: 22px 24px 60px; display: flex; flex-direction: column; gap: 18px; max-width: 1480px; width: 100%; }
.btn.menu-btn { display: none; }

/* ---------- page header ---------- */
.ph { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.ph .eyebrow { font: 600 12px var(--font); text-transform: uppercase; letter-spacing: .12em; color: var(--ink-3); margin-bottom: 4px; }
.ph h1 { font-size: 28px; font-weight: 600; line-height: 1.15; }
.ph .sub { color: var(--ink-2); margin-top: 4px; }
.ph .acts { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.crumbs { font-size: 13px; color: var(--ink-3); display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- cards, grids ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
.card > .hd { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; }
.card > .hd h3 { font-size: 17px; font-weight: 600; }
.card > .hd .hint { color: var(--ink-3); font-size: 13px; }
.card > .hd .acts { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.card > .bd { padding: 14px 16px; }
.card > .bd.flush { padding: 0; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.g-station { grid-template-columns: 300px minmax(0, 1fr); align-items: start; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* ---------- KPI tiles ---------- */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi .lbl { font: 600 11px var(--font); text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); }
.kpi .val { font: 600 30px/1.1 var(--font-head); font-variant-numeric: tabular-nums; }
.kpi .val small { font-size: 15px; color: var(--ink-3); font-weight: 500; }
.kpi .foot { font-size: 12.5px; color: var(--ink-2); }
.kpi.alert { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.kpi.alert .val { color: var(--bad); }

/* ---------- tables ---------- */
.tw { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
.t th { text-align: left; font: 600 11.5px var(--font); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); padding: 9px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; position: sticky; top: 0; }
.t td { padding: 9px 12px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
.t tr:last-child td { border-bottom: 0; }
.t tr.click { cursor: pointer; }
.t tr.click:hover td { background: var(--surface-2); }
.t td.num, .t th.num { text-align: right; font-variant-numeric: tabular-nums; }
.t tr.sel td { background: var(--accent-soft); }

/* ---------- chips ---------- */
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px 2px 8px; border-radius: 999px; font: 600 12px/1.6 var(--font); white-space: nowrap; background: var(--muted-soft); color: var(--ink-2); }
.chip::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .9; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.serious { background: var(--serious-soft); color: var(--serious); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.info { background: var(--info-soft); color: var(--info); }
.chip.plain::before { display: none; }
.sev { font: 700 11px var(--font); letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; border: 1px solid currentColor; }
.sev.Minor { color: var(--warn); }
.sev.Major { color: var(--serious); }
.sev.Critical { color: var(--bad); background: var(--bad-soft); }
.tag { display: inline-block; padding: 1px 7px; border-radius: 4px; background: var(--surface-3); color: var(--ink-2); font: 600 11.5px var(--font); letter-spacing: .03em; }

/* ---------- buttons & forms ---------- */
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--surface-2); text-decoration: none; }
.btn svg { width: 16px; height: 16px; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.good { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.btn.danger.solid { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.sm { padding: 4px 10px; font-size: 13px; }
.btn.lg { padding: 11px 20px; font-size: 16px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.ghost { border-color: transparent; background: transparent; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--ink-2); min-width: 0; }
.in, select.in, textarea.in { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--surface); width: 100%; font-weight: 400; color: var(--ink); }
textarea.in { min-height: 70px; resize: vertical; }
.in:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.fgrid .wide { grid-column: 1 / -1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.filters label.f { min-width: 150px; }

/* ---------- line status board ---------- */
.line { display: flex; flex-direction: column; gap: 10px; }
.line-hd { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.line-hd h4 { font-size: 16px; font-weight: 600; }
.progress { height: 8px; background: var(--surface-3); border-radius: 4px; overflow: hidden; display: flex; }
.progress span { display: block; height: 100%; }
.progress .done { background: var(--ok); }
.progress .wip { background: var(--info); }
.stations { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(118px, 1fr); gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.stn { border: 1px solid var(--line); border-radius: 6px; padding: 8px 9px; background: var(--surface-2); display: flex; flex-direction: column; gap: 3px; min-height: 84px; color: var(--ink); cursor: pointer; text-align: left; }
.stn:hover { border-color: var(--accent); text-decoration: none; }
.stn .op { font: 600 11px var(--font); color: var(--ink-3); letter-spacing: .06em; }
.stn .nm { font: 600 13px/1.2 var(--font-head); }
.stn .u { font: 500 11.5px var(--mono); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stn.active { background: var(--info-soft); border-color: color-mix(in srgb, var(--info) 45%, var(--line)); }
.stn.held { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.stn .q { margin-top: auto; font-size: 11.5px; color: var(--ink-3); }

/* ---------- charts ---------- */
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--ink-3); font: 11px var(--font); }
.chart .grid-l { stroke: var(--line-2); stroke-width: 1; }
.chart .axis { stroke: var(--line); }
.chart .val-l { fill: var(--ink-2); font-weight: 600; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
#tip { position: fixed; z-index: 100; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 12.5px; padding: 6px 9px; border-radius: 5px; max-width: 280px; box-shadow: var(--shadow); white-space: pre-line; }

/* ---------- feed / lists ---------- */
.feed { list-style: none; margin: 0; padding: 0; }
.feed li { display: flex; gap: 10px; padding: 9px 16px; border-bottom: 1px solid var(--line-2); font-size: 13.5px; align-items: flex-start; }
.feed li:last-child { border-bottom: 0; }
.feed .when { color: var(--ink-3); font: 12px var(--mono); flex: none; width: 88px; padding-top: 1px; }
.feed .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--ink-3); }
.feed .dot.bad { background: var(--bad); } .feed .dot.ok { background: var(--ok); } .feed .dot.warn { background: var(--warn); } .feed .dot.info { background: var(--info); }
.attn { list-style: none; margin: 0; padding: 0; }
.attn li { display: flex; gap: 10px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line-2); }
.attn li:last-child { border-bottom: 0; }
.attn .ic { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; flex: none; }
.attn .ic svg { width: 16px; height: 16px; }
.attn .ic.bad { background: var(--bad-soft); color: var(--bad); } .attn .ic.warn { background: var(--warn-soft); color: var(--warn); } .attn .ic.info { background: var(--info-soft); color: var(--info); }
.attn .tx { min-width: 0; flex: 1; font-size: 13.5px; }
.attn .tx b { display: block; font-weight: 600; font-size: 14px; }
.empty { padding: 26px 16px; text-align: center; color: var(--ink-3); }

/* ---------- station terminal ---------- */
.andon { display: flex; gap: 16px; align-items: center; padding: 14px 18px; border-radius: var(--radius); background: var(--side); color: #fff; flex-wrap: wrap; }
.andon .stn-id { font: 600 26px/1 var(--font-head); letter-spacing: .02em; }
.andon .meta { color: var(--side-ink); font-size: 13.5px; }
.andon .light { width: 14px; height: 14px; border-radius: 50%; box-shadow: 0 0 0 4px rgba(255,255,255,.08); }
.andon .light.run { background: #3cc47c; } .andon .light.idle { background: #8a96a3; } .andon .light.hold { background: #f06b61; }
.andon .right { margin-left: auto; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.andon .qual { font-size: 13px; padding: 4px 10px; border-radius: 5px; background: rgba(255,255,255,.08); }
.queue { list-style: none; margin: 0; padding: 0; }
.queue li { border-bottom: 1px solid var(--line-2); }
.queue li:last-child { border-bottom: 0; }
.queue a { display: flex; flex-direction: column; gap: 3px; padding: 10px 14px; color: var(--ink); }
.queue a:hover { background: var(--surface-2); text-decoration: none; }
.queue a.on { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.queue .s { font: 600 13.5px var(--mono); }
.unit-hd { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
.unit-hd .serial { font: 600 22px var(--mono); letter-spacing: -.01em; }
.unit-hd .acts { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.banner { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-radius: var(--radius); border: 1px solid; flex-wrap: wrap; }
.banner svg { width: 20px; height: 20px; flex: none; }
.banner.bad { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 40%, transparent); color: var(--bad); }
.banner.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 40%, transparent); color: var(--warn); }
.banner.ok { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 40%, transparent); color: var(--ok); }
.banner.info { background: var(--info-soft); border-color: color-mix(in srgb, var(--info) 40%, transparent); color: var(--info); }
.banner .tx { color: var(--ink); flex: 1; min-width: 200px; }
.banner .tx b { color: inherit; }
.sec-title { display: flex; align-items: center; gap: 10px; font: 600 12px var(--font); text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); padding: 14px 16px 6px; }
.sec-title .cnt { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; }
.ci { display: grid; grid-template-columns: 44px minmax(0, 1fr) minmax(220px, 330px); gap: 12px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line-2); }
.ci .code { font: 600 12px var(--mono); color: var(--ink-3); display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.ci .code .st { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--line); color: transparent; }
.ci .code .st svg { width: 13px; height: 13px; }
.ci.done .st { background: var(--ok); border-color: var(--ok); color: #fff; }
.ci.fail .st { background: var(--bad); border-color: var(--bad); color: #fff; }
.ci.accepted .st { background: var(--warn); border-color: var(--warn); color: #fff; }
.ci .nm { font-weight: 600; }
.ci .meta { font-size: 12.5px; color: var(--ink-3); display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
.ci .ctl { display: flex; gap: 6px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
.ci .ctl .in { max-width: 150px; font-family: var(--mono); }
.ci .ctl .in.wide { max-width: 210px; }
.ci .res { font: 600 14px var(--mono); }

<script>
/* Ridgeline MES — shared utilities: formatting, PRNG, hashing, formula engine, VIN check digit. */
'use strict';

const U = {
  esc(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  },
  pad(n, w) { return String(n).padStart(w, '0'); },

  fmtDT(ts) {
    if (!ts) return '—';
    const d = new Date(ts);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ' +
      d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
  },
  fmtD(ts) {
    if (!ts) return '—';
    return new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  },
  fmtT(ts) {
    if (!ts) return '—';
    return new Date(ts).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
  },
  ago(ts) {
    if (!ts) return '—';
    const m = Math.round((MES.now() - ts) / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + ' min ago';
    const h = Math.round(m / 60);
    if (h < 36) return h + ' h ago';
    return Math.round(h / 24) + ' d ago';
  },
  dur(ms) {
    if (ms == null || ms < 0) return '—';
    const m = Math.round(ms / 60000);
    if (m < 60) return m + ' min';
    return Math.floor(m / 60) + ' h ' + (m % 60) + ' m';
  },
  num(v, dec) {
    if (v === null || v === undefined || v === '' || isNaN(v)) return '—';
    return Number(v).toFixed(dec == null ? 2 : dec);
  },
  dayKey(ts) {
    const d = new Date(ts);
    return d.getFullYear() + '-' + U.pad(d.getMonth() + 1, 2) + '-' + U.pad(d.getDate(), 2);
  },

  /* deterministic PRNG (mulberry32) for the seed simulation */
  rng(seed) {
    let a = seed >>> 0;
    const f = () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    f.int = (lo, hi) => lo + Math.floor(f() * (hi - lo + 1));
    f.pick = arr => arr[Math.floor(f() * arr.length)];
    f.norm = () => { let s = 0; for (let i = 0; i < 6; i++) s += f(); return (s - 3) / 1.2; };
    return f;
  },

  /* FNV-1a 64-ish hash rendered as hex, used for e-signature manifest digests */
  hash(str) {
    let h1 = 0x811c9dc5, h2 = 0x01000193 ^ 0x5bd1e995;
    for (let i = 0; i < str.length; i++) {
      const c = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ c, 16777619) >>> 0;
      h2 = Math.imul(h2 ^ (c + i), 2246822519) >>> 0;
    }
    return (U.pad(h1.toString(16), 8) + U.pad(h2.toString(16), 8)).toUpperCase();
  },

  /* ---------- VIN (ISO 3779 / 49 CFR 565) check digit ---------- */
  vinCheckDigit(vin) {
    const map = { A: 1, B: 2, C: 3, D: 4, E: 5, F: 6, G: 7, H: 8, J: 1, K: 2, L: 3, M: 4, N: 5, P: 7, R: 9, S: 2, T: 3, U: 4, V: 5, W: 6, X: 7, Y: 8, Z: 9 };
    const w = [8, 7, 6, 5, 4, 3, 2, 10, 0, 9, 8, 7, 6, 5, 4, 3, 2];
    let sum = 0;
    for (let i = 0; i < 17; i++) {
      const ch = vin[i];
      const v = /\d/.test(ch) ? Number(ch) : map[ch];
      if (v === undefined) return null;
      sum += v * w[i];
    }
    const r = sum % 11;
    return r === 10 ? 'X' : String(r);
  },
  vinValid(vin) {
    return /^[A-HJ-NPR-Z0-9]{17}$/.test(vin) && U.vinCheckDigit(vin) === vin[8];
  },
  makeVin(seq) {
    // WMI 5RM (fictional), VDS "T1C4G2", check, year R=2027 MY, plant D, serial
    let vin = '5RMT1C4G2' + 'R' + 'D' + U.pad(seq, 6);
    vin = vin.slice(0, 8) + '0' + vin.slice(9);
    const cd = U.vinCheckDigit(vin);
    return vin.slice(0, 8) + cd + vin.slice(9);
  },
};

/* ---------- Formula engine for calculated characteristics ----------
   Grammar: expr := term (('+'|'-') term)* ; term := unary (('*'|'/') unary)* ;
            unary := '-' unary | primary ; primary := number | ref | fn '(' args ')' | '(' expr ')'
   Refs are characteristic codes in the same operation (C1, C2 ...). */
const Formula = {
  FUNCS: {
    min: (...a) => Math.min(...a),
    max: (...a) => Math.max(...a),
    avg: (...a) => a.reduce((s, x) => s + x, 0) / a.length,
    sum: (...a) => a.reduce((s, x) => s + x, 0),
    abs: x => Math.abs(x),
    sqrt: x => Math.sqrt(x),
    round: (x, d) => { const p = Math.pow(10, d || 0); return Math.round(x * p) / p; },
  },
  tokenize(src) {
    const toks = [];
    const re = /\s*(\d+\.?\d*|\.\d+|[A-Za-z_][A-Za-z0-9_]*|[()+\-*/,])/y;
    let m, pos = 0;
    src = String(src || '');
    while (pos < src.length) {
      re.lastIndex = pos;
      m = re.exec(src);
      if (!m) {
        if (/^\s*$/.test(src.slice(pos))) break;
        throw new Error('Unexpected "' + src.slice(pos).trim()[0] + '" at position ' + (pos + 1));
      }
      toks.push(m[1]);
      pos = re.lastIndex;
    }
    return toks;
  },
  parse(src) {
    const t = Formula.tokenize(src);
    let i = 0;
    const peek = () => t[i];
    const eat = x => { if (t[i] !== x) throw new Error('Expected "' + x + '"' + (t[i] ? ' but found "' + t[i] + '"' : ' at end')); i++; };
    const expr = () => {
      let n = term();
      while (peek() === '+' || peek() === '-') { const op = t[i++]; n = { op, a: n, b: term() }; }
      return n;
    };
    const term = () => {
      let n = unary();
      while (peek() === '*' || peek() === '/') { const op = t[i++]; n = { op, a: n, b: unary() }; }
      return n;
    };
    const unary = () => {
      if (peek() === '-') { i++; return { op: 'neg', a: unary() }; }
      return primary();
    };
    const primary = () => {
      const tok = t[i++];
      if (tok === undefined) throw new Error('Formula ends unexpectedly');
      if (tok === '(') { const n = expr(); eat(')'); return n; }
      if (/^[\d.]/.test(tok)) return { num: Number(tok) };
      if (/^[A-Za-z_]/.test(tok)) {
        if (peek() === '(') {
          const fn = tok.toLowerCase();
          if (!Formula.FUNCS[fn]) throw new Error('Unknown function ' + tok + '()');
          i++;
          const args = [];
          if (peek() !== ')') { args.push(expr()); while (peek() === ',') { i++; args.push(expr()); } }
          eat(')');
          return { fn, args };
        }
        return { ref: tok.toUpperCase() };
      }
      throw new Error('Unexpected "' + tok + '"');
    };
    const tree = expr();
    if (i < t.length) throw new Error('Unexpected "' + t[i] + '"');
    return tree;
  },
  refs(src) {
    const out = new Set();
    const walk = n => {
      if (!n) return;
      if (n.ref) out.add(n.ref);
      if (n.a) walk(n.a);
      if (n.b) walk(n.b);
      if (n.args) n.args.forEach(walk);
    };
    walk(Formula.parse(src));
    return [...out];
  },
  evaluate(src, vars) {
    const ev = n => {
      if (n.num !== undefined) return n.num;
      if (n.ref) {
        if (vars[n.ref] === undefined || vars[n.ref] === null || isNaN(vars[n.ref])) throw new Error('Missing value for ' + n.ref);
        return Number(vars[n.ref]);
      }
      if (n.fn) return Formula.FUNCS[n.fn](...n.args.map(ev));
      if (n.op === 'neg') return -ev(n.a);
      const a = ev(n.a), b = ev(n.b);
      switch (n.op) {
        case '+': return a + b;
        case '-': return a - b;
        case '*': return a * b;
        case '/': if (b === 0) throw new Error('Division by zero'); return a / b;
      }
      throw new Error('Bad node');
    };
    return ev(Formula.parse(src));
  },
};
